services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: bbw123
      MARIADB_DATABASE: db_biztrips
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  backend:
    build: ..
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: db_biztrips
      DB_USER: root
      DB_PASSWORD: bbw123
      APP_STORAGE_LOCATION: /data/uploads
    volumes:
      - photos:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../../refcard-03-fe-react-vite
      args:
        VITE_API_BASE_URL: http://localhost:8080/
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  db-data:
  photos:
