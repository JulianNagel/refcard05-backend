# Profile "local": used by docker compose (see compose/).
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:refcard}
spring.datasource.username=${DB_USER:refcard}
spring.datasource.password=${DB_PASSWORD:refcard}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Local volume storage instead of S3
storage.type=local
storage.local.path=${STORAGE_PATH:/data/images}

management.endpoints.web.exposure.include=health
