# Profile "aws": all connection data comes from environment variables / ECS secrets.
# No credentials in code.

# --- RDS MariaDB ---
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- S3 image storage ---
# The AWS SDK picks up credentials from the ECS task role automatically.
storage.type=s3
storage.s3.bucket=${S3_BUCKET}
storage.s3.region=${AWS_REGION:us-east-1}

# --- Health checks for ECS ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
